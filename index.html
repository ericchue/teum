<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>틈 캘린더</title>
<meta name="description" content="수업 사이 빈 시간에 약속과 과제를 끼워 넣는 캘린더">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="틈">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
@media (max-width:700px){input,select{font-size:16px!important}}

/* Layout: 홈(오늘 한눈에) · 달력(월/주/일) · 할 일 · 약속 · 관리. 빈 시간은 형광펜, 일정은 카테고리 색. 폰에서는 하단 탭 */
:root{
  --paper:#F3F5F9; --surface:#FFFFFF; --ink:#141B2B; --muted:#576274; --line:#E0E5EE; --grid:#EEF1F6;
  --accent:#2D55D9; --accent-ink:#FFFFFF; --accent-soft:#E6ECFD;
  --hl:rgba(255,222,40,.34); --hl-ink:#7A6200;
  --warn:#C2410C; --ok:#2F7D32; --danger:#B42318; --sun:#D23B3B; --sat:#2D55D9;
  --c0-bg:#E8EEFF; --c0-fg:#1A3483; --c0-bd:#3B66F5;
  --c1-bg:#F1EAFE; --c1-fg:#4C1D95; --c1-bd:#8B5CF6;
  --c2-bg:#E3F5EA; --c2-fg:#14532D; --c2-bd:#22A05B;
  --c3-bg:#FDE8EF; --c3-fg:#881337; --c3-bd:#E64980;
  --c4-bg:#FFEDE3; --c4-fg:#7C2D12; --c4-bd:#F07A2E;
  --c5-bg:#DFF5F3; --c5-fg:#134E4A; --c5-bd:#14A39A;
  --c6-bg:#FDF3D7; --c6-fg:#713F12; --c6-bd:#D99A00;
  --c7-bg:#ECEFF4; --c7-fg:#334155; --c7-bd:#7A889E;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1219; --surface:#151A24; --ink:#EDF0F6; --muted:#A1ABBD; --line:#272F3F; --grid:#1B2230;
  --accent:#7393FF; --accent-ink:#0B1020; --accent-soft:#1E2848;
  --hl:rgba(255,222,70,.13); --hl-ink:#E9D46A;
  --warn:#FB923C; --ok:#6BCB77; --danger:#F87171; --sun:#FF8A8A; --sat:#8FA8FF;
  --c0-bg:#1B2647; --c0-fg:#D3DDFF; --c0-bd:#6F8FFF;
  --c1-bg:#281D45; --c1-fg:#E4D6FF; --c1-bd:#A684FF;
  --c2-bg:#14301E; --c2-fg:#BDEECE; --c2-bd:#3FBF77;
  --c3-bg:#381625; --c3-fg:#FFCCDD; --c3-bd:#F06A9A;
  --c4-bg:#382014; --c4-fg:#FFD3BB; --c4-bd:#F59152;
  --c5-bg:#10302D; --c5-fg:#B0EEE8; --c5-bd:#2EC4B6;
  --c6-bg:#31280C; --c6-fg:#F8E2A2; --c6-bd:#E8B520;
  --c7-bg:#222936; --c7-fg:#D3DAE5; --c7-bd:#8F9BB0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1219; --surface:#151A24; --ink:#EDF0F6; --muted:#A1ABBD; --line:#272F3F; --grid:#1B2230;
  --accent:#7393FF; --accent-ink:#0B1020; --accent-soft:#1E2848;
  --hl:rgba(255,222,70,.13); --hl-ink:#E9D46A;
  --warn:#FB923C; --ok:#6BCB77; --danger:#F87171; --sun:#FF8A8A; --sat:#8FA8FF;
  --c0-bg:#1B2647; --c0-fg:#D3DDFF; --c0-bd:#6F8FFF;
  --c1-bg:#281D45; --c1-fg:#E4D6FF; --c1-bd:#A684FF;
  --c2-bg:#14301E; --c2-fg:#BDEECE; --c2-bd:#3FBF77;
  --c3-bg:#381625; --c3-fg:#FFCCDD; --c3-bd:#F06A9A;
  --c4-bg:#382014; --c4-fg:#FFD3BB; --c4-bd:#F59152;
  --c5-bg:#10302D; --c5-fg:#B0EEE8; --c5-bd:#2EC4B6;
  --c6-bg:#31280C; --c6-fg:#F8E2A2; --c6-bd:#E8B520;
  --c7-bg:#222936; --c7-fg:#D3DAE5; --c7-bd:#8F9BB0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;position:relative;isolation:isolate;border:0;background:none;padding:0 2px}
.logo::after{content:"";position:absolute;left:-3px;right:-3px;bottom:3px;height:11px;background:var(--hl);z-index:-1;border-radius:2px}
.topnav{display:flex;gap:2px;flex:1}
.topnav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.topnav button:hover{color:var(--ink);background:var(--grid)}
.topnav button[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.today-lbl{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.icon{width:36px;padding:7px 0}
.danger{color:var(--danger)!important;border-color:var(--danger)!important}
main{padding-block:18px 60px}
.view{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.05em;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .btn{letter-spacing:0;font-weight:500}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.bottomnav{display:none}
.fab{display:none}
.hero{display:grid;gap:10px}
.hero .date{font-family:var(--f-display);font-size:40px;line-height:1.05;letter-spacing:-.01em}
.hero .date small{font-size:.55em;color:var(--muted);margin-left:8px}
.hero .sub{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.hero .sub b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.fakeinput{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;color:var(--muted);font-size:15px}
.fakeinput:hover{border-color:var(--accent)}
.fakeinput .plus{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;flex:none}
.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--c6-bd);background:var(--c6-bg);color:var(--c6-fg);border-radius:12px;padding:12px 14px}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap}
.welcome{display:grid;gap:12px}
.welcome h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;text-align:left;background:var(--paper)}
.step:hover{border-color:var(--accent)}
.step .n{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500}
.step b{font-size:14.5px}
.step span{font-size:12.5px;color:var(--muted)}
.homegrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.homegrid .col{display:grid;gap:16px;min-width:0}
.next{display:grid;gap:6px;border:0;border-left:5px solid var(--bd);padding:2px 0 2px 12px;background:none;text-align:left;width:100%}
.next .when{font-size:13px;font-weight:700;color:var(--fg)}
.next .t{font-size:21px;font-weight:700;line-height:1.3}
.next .m{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.tl{display:grid}
.tlr{display:grid;grid-template-columns:52px 4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.tlr:first-child{border-top:0}
.tlr .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);line-height:1.25}
.tlr .tm small{display:block;font-size:11px;opacity:.75}
.tlr .bar{align-self:stretch;border-radius:2px;background:var(--bd);min-height:28px}
.tlr .tx{min-width:0}
.tlr .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlr .tx span{font-size:12px;color:var(--muted)}
.tlr.task .bar{background:repeating-linear-gradient(180deg,var(--bd) 0 4px,transparent 4px 7px)}
.tlr.past{opacity:.45}
.tlr.gap .bar{background:var(--hl);min-height:22px}
.tlr.gap .tx b{font-weight:500;color:var(--hl-ink)}
.tlr.now-row .tm{color:var(--danger);font-weight:500}
.duel{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.duel:first-child{border-top:0}
.duel .r1{display:flex;gap:8px;align-items:center}
.duel .r1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--grid);white-space:nowrap}
.dday.soon{background:var(--c4-bg);color:var(--c4-fg);font-weight:500}
.prog{height:5px;border-radius:3px;background:var(--grid);overflow:hidden}
.prog i{display:block;height:100%;background:var(--bd)}
.short{color:var(--warn);font-weight:500}
.okline{color:var(--ok)}
.wkstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 2px;display:grid;justify-items:center;gap:4px}
.wk:hover{border-color:var(--accent)}
.wk span{font-size:11px;color:var(--muted)}
.wk b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1}
.wk.today{background:var(--accent);border-color:var(--accent)}
.wk.today span,.wk.today b{color:var(--accent-ink)}
.wkbar{width:6px;height:34px;border-radius:3px;background:var(--grid);display:flex;align-items:flex-end;overflow:hidden}
.wk.today .wkbar{background:color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.wkbar i{display:block;width:100%;background:var(--accent);border-radius:3px}
.wk.today .wkbar i{background:var(--accent-ink)}
.wkdots{display:flex;gap:2px;min-height:6px}
.wkdots i{width:6px;height:6px;border-radius:50%;background:var(--bd)}
.catsum{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.catsum b{color:var(--ink);font-family:var(--f-mono);font-weight:500;margin-left:3px}
.catsum i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin-right:5px}
.caltool{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.seg{display:inline-flex;background:var(--grid);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 18px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.calnav{display:flex;align-items:center;gap:6px}
.calnav .ttl{font-family:var(--f-display);font-size:26px;min-width:7.5em;text-align:center;line-height:1}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip-c{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--bd) 50%,transparent);background:var(--bg);color:var(--fg);border-radius:99px;padding:3px 10px;font-size:12px}
.fchip-c[aria-pressed="false"]{background:transparent;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.calcard{padding:0;overflow:hidden}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh{padding:8px 8px 6px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500}
.mh.sat{color:var(--sat)}.mh.sun{color:var(--sun)}
.mc{min-height:124px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.mc:nth-child(7n+7){border-right:0}
.mc:hover{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.mc.other{background:var(--paper)}
.mc.other .mn,.mc.other .mchip{opacity:.45}
.mc .mn{font-family:var(--f-display);font-size:18px;line-height:1;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 2px -2px;flex:none}
.mc.sat .mn{color:var(--sat)}.mc.sun .mn{color:var(--sun)}
.mc.today .mn{background:var(--accent);color:var(--accent-ink)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mchip{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.35;background:var(--bg);color:var(--fg);border-radius:5px;padding:1px 6px 1px 0;overflow:hidden;white-space:nowrap;min-width:0;flex:none}
.mchip::before{content:"";width:3px;align-self:stretch;background:var(--bd);border-radius:2px;flex:none}
.mchip .ct{font-family:var(--f-mono);font-size:10.5px;opacity:.8;flex:none}
.mchip .cn{overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mchip.due{background:transparent;border:1px dashed var(--bd);padding-left:5px}
.mchip.due::before{display:none}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.agenda{border-top:1px solid var(--line);padding:16px;display:grid;gap:8px}
.agenda .ah{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.agenda .ah h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.cal-scroll{overflow-x:auto}
.tgrid{display:grid;min-width:0}
.tgrid.week{min-width:680px}
.corner,.dh{border-bottom:1px solid var(--line);padding:8px 6px}
.dh{border:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:4px;background:none;text-align:left}
.dh:hover{background:var(--grid)}
.dh .top2{display:flex;align-items:baseline;gap:6px}
.dh .dn{font-size:12px;color:var(--muted)}
.dh .dd{font-family:var(--f-display);font-size:22px;line-height:1}
.dh.sat .dn{color:var(--sat)}.dh.sun .dn{color:var(--sun)}
.dh.today .dd,.dh.today .dn{color:var(--accent);font-weight:700}
.dh .busy{margin-left:auto;font-size:10px;font-weight:700;color:var(--danger)}
.dens{height:4px;border-radius:2px;background:var(--grid);overflow:hidden}
.dens i{display:block;height:100%;background:var(--accent);border-radius:2px}
.dens i.mid{background:var(--warn)}.dens i.high{background:var(--danger)}
.tcol{position:relative}
.tcol span{position:absolute;right:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);transform:translateY(-7px)}
.dcol{position:relative;border-left:1px solid var(--line);cursor:copy}
.dcol.past{background-color:color-mix(in srgb,var(--grid) 40%,transparent)}
.gap{position:absolute;left:0;right:0;background:var(--hl);pointer-events:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 6px}
.gap span{font-size:10.5px;font-weight:700;color:var(--hl-ink)}
.ev{position:absolute;border-radius:7px;padding:3px 7px;font-size:12.5px;line-height:1.3;overflow:hidden;border:1px solid color-mix(in srgb,var(--bd) 30%,transparent);border-left:4px solid var(--bd);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;background:var(--bg);color:var(--fg)}
.ev:hover{filter:brightness(.97);z-index:3}
.ev .et{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .em{font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.ev .ep{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .rep{font-size:10px;margin-right:3px;opacity:.8}
.ev.task{background:repeating-linear-gradient(135deg,var(--bg) 0 7px,color-mix(in srgb,var(--bg) 45%,var(--surface)) 7px 14px);border-style:dashed;border-left:4px solid var(--bd)}
.tgrid.day .ev{font-size:15px;padding:6px 12px}
.tgrid.day .ev .em,.tgrid.day .ev .ep{font-size:12.5px}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.legend .p-task{background:repeating-linear-gradient(135deg,var(--c7-bg) 0 3px,var(--surface) 3px 6px);border:1px dashed var(--c7-bd)}
.legend .p-gap{background:var(--hl)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.task .tt{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .meta{grid-column:2/4;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
form.mini{display:grid;gap:9px}
form.mini .r{display:flex;gap:8px;flex-wrap:wrap}
form.mini input,form.mini select,.catedit input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 9px;min-width:0;flex:1}
form.mini input[type=number]{max-width:90px;flex:0 0 90px}
form.mini label{font-size:12px;color:var(--muted);display:grid;gap:3px;flex:1;min-width:0}
.daypick{display:flex;gap:4px}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick label{display:block;flex:1}
.daypick span{display:block;text-align:center;border:1px solid var(--line);border-radius:7px;padding:6px 0;font-size:13px;cursor:pointer;color:var(--ink)}

<script>
(function(){
const H0=8,H1=23,DAY_S=9*60,DAY_E=22*60;
const DAYS=['월','화','수','목','금','토','일'];
const FRIENDS=['지수','현우','서연','민재'];
const NCOL=8;
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const wdIdx=d=>(d.getDay()+6)%7;
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const fmtDate=d=>`${d.getMonth()+1}월 ${d.getDate()}일(${DAYS[wdIdx(d)]})`;
const hrs=m=>(Math.round(m/6)/10)+'시간';
const num=m=>String(Math.round(m/6)/10);
const fmtDur=m=>{const h=Math.floor(m/60),mm=m%60;return ((h?h+'시간 ':'')+(mm?mm+'분':'')).trim()||'곧'};
const wkCls=i=>i===5?'sat':i===6?'sun':'';
const clone=o=>JSON.parse(JSON.stringify(o));

const DEFAULT_CATS=[
  {id:'school',name:'학교',color:0,kw:['수업','강의','과제','레포트','시험','퀴즈','스터디','랩','연구실','세미나','교수','조별','팀플','발표','동아리','도서관']},
  {id:'church',name:'교회',color:1,kw:['예배','교회','셀모임','구역','찬양','기도','성경','청년부','수련회','큐티','말씀','주일']},
  {id:'family',name:'가족',color:2,kw:['가족','엄마','아빠','부모님','동생','누나','언니','할머니','할아버지','본가','집밥']},
  {id:'gf',name:'여자친구',color:3,kw:['여자친구','여친','데이트','기념일','커플']},
  {id:'personal',name:'개인',color:4,kw:['알바','운동','헬스','병원','친구','생일','미용실']}
];
const empty=()=>({v:2,hidden:[],cats:clone(DEFAULT_CATS),repeats:[],events:[],tasks:[],welcomed:false,sampleOK:false});
function seed(){
  const T=today(),d=n=>ymd(addDays(T,n));
  return {v:2,hidden:[],cats:clone(DEFAULT_CATS),welcomed:true,sampleOK:false,
    repeats:[
      {id:uid(),title:'자료구조',days:[0,2],start:'10:30',end:'12:00',place:'공학관 301',cat:'school'},
      {id:uid(),title:'선형대수',days:[1,3],start:'13:30',end:'15:00',place:'과학관 112',cat:'school'},
      {id:uid(),title:'영어회화',days:[4],start:'10:00',end:'12:00',place:'인문관 204',cat:'school'},
      {id:uid(),title:'캡스톤 디자인',days:[3],start:'16:00',end:'18:00',place:'공학관 512',cat:'school'},
      {id:uid(),title:'연구실 세미나',days:[4],start:'15:00',end:'16:00',place:'공학관 610',cat:'school'},
      {id:uid(),title:'수요 저녁 예배',days:[2],start:'19:30',end:'21:00',place:'본당',cat:'church'},
      {id:uid(),title:'주일 예배',days:[6],start:'11:00',end:'12:30',place:'본당',cat:'church'},
      {id:uid(),title:'청년부 모임',days:[6],start:'13:30',end:'15:00',place:'교육관 3층',cat:'church'}
    ],
    events:[
      {id:uid(),title:'지수 생일 저녁',date:d(1),start:'19:00',end:'21:00',place:'연남동',cat:'personal'},
      {id:uid(),title:'토익 스터디',date:d(2),start:'18:00',end:'19:30',place:'중앙도서관',cat:'school'},
      {id:uid(),title:'카페 알바',date:d(3),start:'12:00',end:'17:00',place:'정문 앞 카페',cat:'personal'},
      {id:uid(),title:'여자친구랑 성수 데이트',date:d(3),start:'18:00',end:'21:00',place:'성수',cat:'gf'},
      {id:uid(),title:'가족 저녁',date:d(4),start:'18:00',end:'20:00',place:'본가',cat:'family'},
      {id:uid(),title:'교수님 면담',date:d(6),start:'11:00',end:'11:30',place:'공학관 512',cat:'school'}
    ],
    tasks:[
      {id:uid(),title:'선형대수 퀴즈 준비',due:d(1)+'T13:30',hours:2,done:false,cat:'school'},
      {id:uid(),title:'자료구조 과제 3',due:d(2)+'T23:59',hours:4,done:false,cat:'school'},
      {id:uid(),title:'캡스톤 중간발표 자료',due:d(8)+'T16:00',hours:6,done:false,cat:'school'}
    ]};
}
function guessCatIn(cats,text){
  for(const c of cats){if(text.includes(c.name))return c.id;if(c.kw.some(k=>k&&text.includes(k)))return c.id}
  return null;
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('teum-v1'));
    if(s&&s.v===2)return s;
    if(s&&s.v===1){
      const cats=clone(DEFAULT_CATS);
      return {v:2,hidden:[],cats,welcomed:true,sampleOK:false,
        repeats:s.classes.map(c=>({...c,cat:'school'})),
        events:s.events.map(e=>({...e,cat:guessCatIn(cats,e.title)||'personal'})),
        tasks:s.tasks.map(t=>({...t,cat:'school'}))};
    }
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem('teum-v1',JSON.stringify(state))}catch(e){}}

let state=load()||empty();
const isSample=()=>!state.sampleOK&&(state.repeats.some(r=>r.title==='연구실 세미나'&&r.place==='공학관 610')||state.tasks.some(t=>t.title==='캡스톤 중간발표 자료'));
const ROUTES=['home','cal','tasks','poll','manage'];
let route=ROUTES.includes(location.hash.slice(1))?location.hash.slice(1):'home';
const mqPhone=window.matchMedia?window.matchMedia('(max-width:700px)'):{matches:false};
let calMode='month',calDate=today();
let sched={blocks:[],short:{}};
let poll={name:'조별과제 회의',dur:1,week:0,friends:new Set(FRIENDS)};
let itemMap={},itemSeq=0;
let qCat=null,qCatManual=false,addingCat=false;

const catOf=id=>state.cats.find(c=>c.id===id)||state.cats[0];
const cvars=id=>{const i=catOf(id).color;return `--bg:var(--c${i}-bg);--fg:var(--c${i}-fg);--bd:var(--c${i}-bd)`};
const guessCat=t=>guessCatIn(state.cats,t);
const pill=id=>`<span class="pill" style="${cvars(id)}">${esc(catOf(id).name)}</span>`;
const fallbackCat=()=>state.cats.find(c=>c.id==='personal')?'personal':state.cats[0].id;
const reg=it=>{const k='i'+(itemSeq++);itemMap[k]=it;return k};

/* ---------- 일정 계산 ---------- */
function busyIntervals(ds){
  const wd=wdIdx(fromYmd(ds)),out=[];
  state.repeats.forEach(c=>{if(c.days.includes(wd))out.push({s:toMin(c.start),e:toMin(c.end),kind:'repeat',title:c.title,place:c.place,cat:c.cat,ref:c.id,date:ds})});
  state.events.forEach(ev=>{if(ev.date===ds)out.push({s:toMin(ev.start),e:toMin(ev.end),kind:'appt',title:ev.title,place:ev.place,cat:ev.cat,ref:ev.id,date:ds})});
  return out;
}
function freeGaps(iv,ws,we){
  const a=iv.filter(x=>x.e>ws&&x.s<we).sort((x,y)=>x.s-y.s),gaps=[];let cur=ws;
  for(const x of a){if(x.s>cur)gaps.push({s:cur,e:Math.min(x.s,we)});cur=Math.max(cur,x.e)}
  if(cur<we)gaps.push({s:cur,e:we});
  return gaps.filter(g=>g.e>g.s);
}
function schedule(){
  const now=new Date(),T=today(),blocks=[],short={},occ={};
  const getOcc=ds=>occ[ds]||(occ[ds]=busyIntervals(ds).map(x=>({s:x.s-15,e:x.e+15})));
  const tasks=state.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due));
  for(const t of tasks){
    let remain=Math.round(t.hours*60);
    const due=new Date(t.due);
    let day=T;
    while(remain>0&&day<=due){
      const ds=ymd(day);
      let ws=DAY_S,we=DAY_E;
      if(ds===ymd(now))ws=Math.max(ws,Math.ceil((nowMin()+10)/30)*30);
      if(ds===ymd(due))we=Math.min(we,due.getHours()*60+due.getMinutes()-30);
      let used=0;
      for(const g of freeGaps(getOcc(ds),ws,we)){
        let cur=g.s;
        while(remain>0&&used<180){
          let len=Math.min(120,remain,g.e-cur,180-used);
          len=Math.floor(len/30)*30;
          if(len<Math.min(60,remain)||len<30)break;
          blocks.push({taskId:t.id,title:t.title,cat:t.cat,date:ds,s:cur,e:cur+len});
          getOcc(ds).push({s:cur-15,e:cur+len+15});
          remain-=len;used+=len;cur+=len+30;
        }
      }
      day=addDays(day,1);
    }
    if(remain>0)short[t.id]=remain;
  }
  sched={blocks,short};
}
function dayItems(ds){
  const items=busyIntervals(ds);
  sched.blocks.filter(b=>b.date===ds).forEach(b=>items.push({s:b.s,e:b.e,kind:'task',title:b.title,cat:b.cat,ref:b.taskId,date:ds}));
  return items.sort((a,b)=>a.s-b.s);
}
const busyOf=items=>items.reduce((a,x)=>a+Math.max(0,Math.min(x.e,DAY_E)-Math.max(x.s,DAY_S)),0);
const dueOn=ds=>state.tasks.filter(t=>!t.done&&t.due.slice(0,10)===ds);

/* ---------- 빠른 입력 해석 ---------- */
const TP='(오전|오후|아침|점심|낮|저녁|밤)?\\s*(\\d{1,2})(?:\\s*:\\s*(\\d{2})|\\s*시(?!간)\\s*(?:(반)|(\\d{1,2})\\s*분)?)';
const RANGE_RE=new RegExp(TP+'\\s*(?:부터|에서|~|-|–|—)\\s*'+TP+'\\s*(?:까지)?(?:\\s*에)?');
const SINGLE_RE=new RegExp(TP+'\\s*(?:에)?');
function adjHour(mk,h){
  if(['오후','저녁','밤'].includes(mk)&&h<12)return h+12;
  if(['점심','낮'].includes(mk)&&h<=5)return h+12;
  if(!mk&&h>=1&&h<=7)return h+12;
  return h;
}
const tok=(g,o)=>({mk:g[o]||'',h:+g[o+1],m:g[o+2]?+g[o+2]:g[o+3]?30:g[o+4]?+g[o+4]:0});
function parseQuick(raw,forceWeekly){
  if(!raw.trim())return null;
  let s=' '+raw.trim()+' ';
  const T=today(),notes=[];let date=null,start=null,end=null,dur=null,place='';
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(m[0],' ');return m};
  let m;
  const weekly=!!cut(/매주\s*/)||forceWeekly;
  if((m=cut(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))){let d=new Date(T.getFullYear(),+m[1]-1,+m[2]);if(d<addDays(T,-60))d.setFullYear(d.getFullYear()+1);date=d}
  else if((m=cut(/(다음\s*주|담주)\s*([월화수목금토일])(?:요일|욜)?/)))date=addDays(mondayOf(T),7+DAYS.indexOf(m[2]));
  else if((m=cut(/(?:이번\s*주\s*)?([월화수목금토일])(?:요일|욜)/))){let d=addDays(mondayOf(T),DAYS.indexOf(m[1]));if(d<T)d=addDays(d,7);date=d}
  else if(cut(/오늘/))date=T;else if(cut(/내일/))date=addDays(T,1);else if(cut(/모레/))date=addDays(T,2);
  if((m=cut(RANGE_RE))){
    const a=tok(m,1),b=tok(m,6);
    start=adjHour(a.mk,a.h)*60+a.m;
    end=adjHour(b.mk||a.mk,b.h)*60+b.m;
    if(end<=start&&end+720<=1440)end+=720;
    if(end<=start)end=Math.min(start+60,1439);
  }else if((m=cut(SINGLE_RE))){const a=tok(m,1);start=adjHour(a.mk,a.h)*60+a.m}
  if(start===null){if(/점심/.test(s))start=720;else if(/저녁/.test(s))start=1140;else if(/아침/.test(s))start=540}
  if((m=cut(/(\d+(?:\.\d+)?)\s*시간(?:\s*(\d{1,2})\s*분)?/)))dur=Math.round(parseFloat(m[1])*60+(m[2]?+m[2]:0));
  else if((m=cut(/(\d{1,3})\s*분/)))dur=+m[1];
  if((m=cut(/(\S+)에서/)))place=m[1];
  const isTask=/까지/.test(s)&&!weekly;
  s=s.replace(/까지/g,' ').replace(/\s+/g,' ').trim().replace(/^(에|에는|은|는)\s+/,'');
  const title=s;
  if(!title)return{error:'무엇을 하는지 적어주세요 (예: 저녁 예배)'};
  if(isTask){
    if(!date)return{error:'마감 날짜를 찾지 못했어요 (예: 금요일까지)'};
    const dueM=start===null?23*60+59:start;
    const hours=dur?dur/60:2;if(!dur)notes.push('예상 시간이 없어 2시간으로 잡았어요');
    return{kind:'task',title,date,dueM,hours,notes};
  }
  if(start!==null&&start>=24*60)start=23*60;
  if(!date)date=weekly?T:((start===null||start>nowMin())?T:addDays(T,1));
  if(start===null){start=720;notes.push('시간을 못 찾아 12:00으로 넣었어요')}
  if(end===null){if(!dur)dur=/저녁|밥|식사|점심|술|회식|예배/.test(raw)?90:60;end=start+dur}
  end=Math.min(end,24*60-1);
  return{kind:weekly?'repeat':'appt',title,date,start,end,place,notes};
}

/* ---------- 공통 조각 ---------- */
function layout(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  const assign=cl=>{const lanes=[];cl.forEach(it=>{let i=lanes.findIndex(e=>e<=it.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=it.e;it.lane=i});cl.forEach(it=>it.lanes=lanes.length)};
  let cur=[],end=-1e9;
  for(const it of items){if(cur.length&&it.s>=end){assign(cur);cur=[];end=-1e9}cur.push(it);end=Math.max(end,it.e)}
  if(cur.length)assign(cur);
  return items;
}
function timeGrid(dates,px,mode){
  const T=today(),todayS=ymd(T),single=dates.length===1;
  let head=single?'':'<div class="corner"></div>';
  let tcol=`<div class="tcol" style="height:${(H1-H0)*px}px">`;for(let h=H0+1;h<H1;h++)tcol+=`<span style="top:${(h-H0)*px}px">${pad(h)}</span>`;tcol+='</div>';
  let cols='';
  dates.forEach(d=>{
    const ds=ymd(d),all=dayItems(ds),i=wdIdx(d);
    const busy=busyOf(all),pct=Math.min(100,busy/(DAY_E-DAY_S)*100),lvl=busy>=9*60?'high':busy>=6*60?'mid':'';
    if(!single)head+=`<button class="dh ${wkCls(i)} ${ds===todayS?'today':''}" data-openday="${ds}"><div class="top2"><span class="dn">${DAYS[i]}</span><span class="dd">${d.getDate()}</span>${busy>=9*60?'<span class="busy">과부하</span>':''}</div><div class="dens" title="바쁜 시간 ${hrs(busy)}"><i class="${lvl}" style="width:${pct}%"></i></div></button>`;
    let inner='';
    if(d>=T){
      const ws=ds===todayS?Math.max(DAY_S,Math.ceil(nowMin()/30)*30):DAY_S;
      freeGaps(all,ws,DAY_E).forEach(g=>{if(g.e-g.s>=60)inner+=`<div class="gap" style="top:${(g.s/60-H0)*px}px;height:${(g.e-g.s)/60*px}px"><span>틈 ${hrs(g.e-g.s)}</span></div>`});
    }
    layout(all.filter(x=>!state.hidden.includes(x.cat))).forEach(it=>{
      const k=reg(it);
      const top=(it.s/60-H0)*px,h=Math.max(18,(it.e-it.s)/60*px-2),w=100/it.lanes;
      inner+=`<button class="ev ${it.kind==='task'?'task':''}" data-ev="${k}" style="${cvars(it.cat)};top:${top}px;height:${h}px;left:calc(${it.lane*w}% + 2px);width:calc(${w}% - 4px)"><span class="et">${it.kind==='repeat'?'<span class="rep">↻</span>':''}${esc(it.title)}</span>${h>30?`<span class="em">${toHM(it.s)}–${toHM(it.e)}</span>`:''}${h>50&&it.place?`<span class="ep">${esc(it.place)}</span>`:''}</button>`;
    });
    if(ds===todayS){const nm=nowMin();if(nm>=H0*60&&nm<=H1*60)inner+=`<div class="nowline" style="top:${(nm/60-H0)*px}px"></div>`}
    cols+=`<div class="dcol ${d<T?'past':''}" data-date="${ds}" data-px="${px}" style="height:${(H1-H0)*px}px;background-image:repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px ${px}px)">${inner}</div>`;
  });
  return `<div class="cal-scroll"><div class="tgrid ${mode}" style="grid-template-columns:46px repeat(${dates.length},minmax(0,1fr))">${head}${tcol}${cols}</div></div>`;
}
function timelineHTML(ds,withGaps){
  const T=today(),isToday=ds===ymd(T),nm=nowMin(),all=dayItems(ds),items=all.filter(x=>!state.hidden.includes(x.cat));
  let rows=items.map(it=>({type:'it',it,s:it.s}));
  if(withGaps&&fromYmd(ds)>=T){
    const ws=isToday?Math.max(DAY_S,Math.ceil(nm/30)*30):DAY_S;
    freeGaps(all,ws,DAY_E).filter(g=>g.e-g.s>=60).forEach(g=>rows.push({type:'gap',g,s:g.s}));
  }
  rows.sort((a,b)=>a.s-b.s);
  let html=rows.map(r=>{
    if(r.type==='gap')return `<button class="tlr gap" data-add data-date="${ds}" data-time="${toHM(r.g.s)}" data-end="${toHM(r.g.e)}"><span class="tm">${toHM(r.g.s)}<small>${toHM(r.g.e)}</small></span><span class="bar"></span><span class="tx"><b>빈 틈 ${hrs(r.g.e-r.g.s)}</b><span>눌러서 이 시간에 일정 넣기</span></span><span></span></button>`;
    const it=r.it,past=isToday&&it.e<=nm,cur=isToday&&it.s<=nm&&it.e>nm;
    const tag=it.kind==='repeat'?'↻ 매주':it.kind==='task'?'과제 작업':'';
    return `<button class="tlr ${it.kind==='task'?'task':''} ${past?'past':''} ${cur?'now-row':''}" data-ev="${reg(it)}" style="${cvars(it.cat)}"><span class="tm">${toHM(it.s)}<small>${toHM(it.e)}</small></span><span class="bar"></span><span class="tx"><b>${esc(it.title)}</b><span>${[cur?'지금 진행 중':'',tag,it.place].filter(Boolean).map(esc).join(' · ')}</span></span>${pill(it.cat)}</button>`;
  }).join('');
  const dues=dueOn(ds);
  if(dues.length)html=dues.map(t=>`<div class="tlr" style="${cvars(t.cat)}"><span class="tm">${t.due.slice(11)}</span><span class="bar" style="background:none;border:2px dashed var(--bd)"></span><span class="tx"><b>마감 · ${esc(t.title)}</b><span>과제 마감 시각</span></span>${pill(t.cat)}</div>`).join('')+html;
  return html?`<div class="tl">${html}</div>`:`<p class="hint">일정이 없어요. 하루 종일 틈이에요.</p>`;
}
function taskRow(t,compact){
  const T=today(),due=new Date(t.due),dd=Math.round((new Date(due.getFullYear(),due.getMonth(),due.getDate())-T)/864e5);
  const placed=sched.blocks.filter(b=>b.taskId===t.id).reduce((a,b)=>a+b.e-b.s,0),total=t.hours*60;
  const sh=sched.short[t.id],label=dd<0?'지남':dd===0?'오늘':'D-'+dd;
  const next=sched.blocks.find(b=>b.taskId===t.id);
  const status=t.done?'':`<div class="prog"><i style="width:${Math.min(100,placed/total*100)}%"></i></div>
    ${sh?`<span class="short">시간 부족: ${hrs(sh)} 더 필요해요</span>`:`<span class="okline">${hrs(placed)} 배치됨${next?` · 첫 작업 ${fmtDate(fromYmd(next.date))} ${toHM(next.s)}`:''}</span>`}`;
  if(compact)return `<div class="duel" style="${cvars(t.cat)}"><div class="r1"><span class="dday ${dd<=1?'soon':''}">${label}</span><b>${esc(t.title)}</b>${pill(t.cat)}</div><span class="hint">${fmtDate(due)} ${t.due.slice(11)} 마감 · 예상 ${t.hours}시간</span>${status}</div>`;
  return `<div class="task ${t.done?'done':''}" style="${cvars(t.cat)}">
    <input type="checkbox" id="tk-${t.id}" data-done="${t.id}" ${t.done?'checked':''} aria-label="${esc(t.title)} 완료">
    <label class="tt" for="tk-${t.id}">${esc(t.title)} ${pill(t.cat)}</label>
    <span class="dday ${dd<=1&&!t.done?'soon':''}">${label}</span>
    <div class="meta"><span>${fmtDate(due)} ${t.due.slice(11)} 마감 · 예상 ${t.hours}시간</span>${status}</div></div>`;
}
const catSelect=(id,sel)=>`<select id="${id}">${state.cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
function weekCatSummary(mon){
  const per={};
  for(let i=0;i<7;i++)dayItems(ymd(addDays(mon,i))).forEach(x=>{const k=x.kind==='task'?'__task':x.cat;per[k]=(per[k]||0)+(x.e-x.s)});
  return state.cats.filter(c=>per[c.id]).map(c=>`<span style="${cvars(c.id)}"><i></i>${esc(c.name)}<b>${num(per[c.id])}</b>시간</span>`).join('')+(per.__task?`<span style="${cvars(state.cats[0].id)}"><i style="background:repeating-linear-gradient(135deg,var(--bd) 0 2px,transparent 2px 4px)"></i>과제 작업<b>${num(per.__task)}</b>시간</span>`:'');
}

/* ---------- 홈 ---------- */
function vHome(){
  const T=today(),ts=ymd(T),nm=nowMin(),items=dayItems(ts);
  const freeToday=freeGaps(items,Math.max(DAY_S,Math.ceil(nm/30)*30),DAY_E).filter(g=>g.e-g.s>=60).reduce((a,g)=>a+g.e-g.s,0);
  const upcoming=state.tasks.filter(t=>!t.done&&new Date(t.due)>=new Date()).sort((a,b)=>a.due.localeCompare(b.due));
  const soon=upcoming.filter(t=>new Date(t.due)<addDays(T,8));
  const isEmpty=!state.repeats.length&&!state.events.length&&!state.tasks.length;
  let nx=items.find(x=>x.e>nm),nxDay='오늘';
  if(!nx){for(let k=1;k<=7&&!nx;k++){const its=dayItems(ymd(addDays(T,k)));if(its.length){nx=its[0];nxDay=k===1?'내일':fmtDate(addDays(T,k))}}}
  let nextHTML='<p class="hint">앞으로 7일 동안 잡힌 일정이 없어요.</p>';
  if(nx){
    const when=nxDay==='오늘'?(nx.s<=nm?`지금 진행 중 · ${fmtDur(nx.e-nm)} 남음`:`${fmtDur(nx.s-nm)} 후`):`${nxDay} ${toHM(nx.s)}`;
    nextHTML=`<button class="next" data-ev="${reg(nx)}" style="${cvars(nx.cat)}"><span class="when">${when}</span><span class="t">${esc(nx.title)}</span><span class="m">${toHM(nx.s)}–${toHM(nx.e)}${nx.place?' · '+esc(nx.place):''}</span><span>${pill(nx.cat)}${nx.kind==='task'?' <span class="hint">과제 작업 시간</span>':''}</span></button>`;
  }

  for(let i=0;i<7;i++){const d=addDays(mon,i),ds=ymd(d),its=dayItems(ds),busy=busyOf(its);
    const cats=[...new Set(its.filter(x=>x.kind!=='task').map(x=>x.cat))].slice(0,4);
    strip+=`<button class="wk ${ds===ts?'today':''}" data-openday="${ds}"><span>${DAYS[i]}</span><b>${d.getDate()}</b><div class="wkbar"><i style="height:${Math.min(100,busy/(DAY_E-DAY_S)*100)}%"></i></div><div class="wkdots">${cats.map(c=>`<i style="${cvars(c)}"></i>`).join('')}</div></button>`}
  const banner=isSample()?`<div class="banner"><span><b>지금은 예시 일정이 들어 있어요.</b> 내 일정으로 새로 시작할까요?</span><span class="acts"><button class="btn primary" data-clearsample>모두 지우고 새로 시작</button><button class="btn" data-keepsample>예시 그대로 두기</button></span></div>`:'';
  const welcome=(isEmpty&&!state.welcomed)?`<section class="card welcome"><h3>새로 시작해볼까요?</h3><p class="hint">빈 달력이에요. 세 단계면 내 일주일이 채워져요.</p>
    <div class="steps">
      <button class="step" data-go="manage"><span class="n">1단계</span><b>매주 고정 일정 넣기</b><span>수업, 예배, 알바처럼 매주 같은 시간 일정을 한 번에 등록해요.</span></button>
      <button class="step" data-add><span class="n">2단계</span><b>약속은 말하듯 적기</b><span>"금요일 7시부터 9시 여자친구랑 저녁"처럼 적으면 끝이에요.</span></button>
      <button class="step" data-go="tasks"><span class="n">3단계</span><b>과제는 마감과 시간만</b><span>"레포트 금요일까지 3시간"이라고 적으면 빈 시간에 나눠 넣어줘요.</span></button>
    </div>

  return `<section class="hero">

        <section class="card"><h2>마감 임박 <button class="btn ghost" data-go="tasks">전체 보기</button></h2>${soon.length?soon.slice(0,4).map(t=>taskRow(t,true)).join(''):'<p class="hint">일주일 안에 마감인 과제가 없어요.</p>'}</section>

      </div>
    </div>`;

/* ---------- 약속 맞추기 ---------- */
function hash(str){let x=2166136261;for(const c of str){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return(x>>>0)/4294967295}
function friendFree(name,ds,h){
  const wd=wdIdx(fromYmd(ds)),p=wd<5?(h<18?0.42:0.22):0.3;
  if(hash(name+'|'+wd+'|'+h)<p)return false;
  if(hash(name+'#'+ds+'#'+h)<0.08)return false;
  return true;
}
function meFree(ds,h){
  const s=h*60,e=s+60,T=today(),d=fromYmd(ds);
  if(d<T||(ds===ymd(T)&&s<nowMin()))return null;
  return !busyIntervals(ds).some(x=>x.s<e&&x.e>s);
}
function pollData(){
  const start=addDays(mondayOf(today()),poll.week*7),dates=[],cells={};
  const people=['나',...FRIENDS.filter(f=>poll.friends.has(f))];
  for(let i=0;i<7;i++){const ds=ymd(addDays(start,i));dates.push(ds);
    for(let h=9;h<22;h++){const me=meFree(ds,h);if(me===null){cells[ds+h]=null;continue}
      cells[ds+h]=people.filter(p=>p==='나'?me:friendFree(p,ds,h))}}
  const slots=[];
  dates.forEach(ds=>{for(let h=9;h<=22-poll.dur;h++){let common=null,ok=true;
    for(let k=0;k<poll.dur;k++){const c=cells[ds+(h+k)];if(!c){ok=false;break}common=common?common.filter(x=>c.includes(x)):c.slice()}
    if(ok&&common&&common.includes('나'))slots.push({ds,h,who:common})}});
  slots.sort((a,b)=>b.who.length-a.who.length||a.ds.localeCompare(b.ds)||a.h-b.h);
  const best=[];for(const s of slots){if(best.some(b=>b.ds===s.ds&&Math.abs(b.h-s.h)<poll.dur+1))continue;best.push(s);if(best.length===3)break}
  return{dates,cells,people,best};
}
function vPoll(){
  const {dates,cells,people,best}=pollData(),n=people.length;
  let g='<div></div>'+dates.map(ds=>{const d=fromYmd(ds),i=wdIdx(d);return `<div class="ph" style="${i===5?'color:var(--sat)':i===6?'color:var(--sun)':''}">${DAYS[i]}<b>${d.getDate()}</b></div>`}).join('');
  for(let h=9;h<22;h++){g+=`<div class="pt">${h}</div>`;
    dates.forEach(ds=>{const c=cells[ds+h];
      if(c===null){g+='<span class="pc past" aria-hidden="true"></span>';return}
      g+=`<button class="pc ${c.length===n?'full':''}" data-cell="${ds}|${h}" style="background:color-mix(in srgb,var(--accent) ${Math.round(c.length/n*100)}%,var(--grid))" aria-label="${fmtDate(fromYmd(ds))} ${h}시, ${c.length}/${n}명 가능"></button>`})}
  const bestHTML=best.length?best.map((s,i)=>{const miss=people.filter(p=>!s.who.includes(p));
    return `<div class="slot ${miss.length?'':'all'}"><div class="si"><div class="sd">${fmtDate(fromYmd(s.ds))} ${pad(s.h)}:00–${pad(s.h+poll.dur)}:00</div><div class="sm">${miss.length?'못 오는 사람: '+miss.join(', '):'모두 가능해요'}</div></div><button class="btn ${i===0?'primary':''}" data-confirm="${s.ds}|${s.h}">확정</button></div>`}).join(''):'<p class="hint">내가 비는 시간이 없어요. 다른 주를 골라보세요.</p>';
  return `<div class="two">
    <section class="card"><h2>약속 시간 맞추기</h2>
      <p class="hint" style="margin-bottom:10px">내 칸은 달력으로 자동 채워지고, 진할수록 많이 되는 시간이에요. 친구 응답은 예시 데이터예요. 친구가 링크로 들어와 직접 칠하는 기능은 서버를 붙이면 쓸 수 있어요.</p>
      <div class="pgrid-wrap"><div class="pgrid">${g}</div></div>
      <div class="who" id="who" style="margin-top:8px">칸을 누르면 누가 되는지 보여요.</div></section>
    <div class="view">
      <section class="card"><h2>모임 정보</h2><form class="mini" id="pollForm">
        <label>모임 이름<input id="pf-name" value="${esc(poll.name)}"></label>
        <div class="r"><label>얼마나<select id="pf-dur">${[1,2,3].map(v=>`<option value="${v}" ${poll.dur===v?'selected':''}>${v}시간</option>`).join('')}</select></label>
        <label>언제<select id="pf-week"><option value="0" ${poll.week===0?'selected':''}>이번 주</option><option value="1" ${poll.week===1?'selected':''}>다음 주</option></select></label></div>
        <div class="friends"><span class="fchip me" aria-pressed="true">나 (달력 연동)</span>${FRIENDS.map(f=>`<button type="button" class="fchip" data-friend="${f}" aria-pressed="${poll.friends.has(f)}">${f}</button>`).join('')}</div>
      </form></section>
      <section class="card"><h2>추천 시간</h2><div class="best">${bestHTML}</div></section>
    </div></div>`;
}

function addCategory(name){

  const used=state.cats.map(c=>c.color);

    const t={id:uid(),title:p.title,due:ymd(p.date)+'T'+toHM(p.dueM),hours:p.hours,done:false,cat};

  }else{
    const ds=ymd(p.date);

    state.events.push({id:uid(),title:p.title,date:ds,start:toHM(p.start),end:toHM(p.end),place:p.place,cat});
    calDate=p.date;commit();
    toast(clash?`'${clash.title}'와 시간이 겹쳐요`:`${fmtDate(p.date)} ${toHM(p.start)}에 추가했어요`,clash?'warn':'');
  }
}

  }else{const t=state.tasks.find(x=>x.id===it.ref);if(!t)return;cat=t.cat;const due=new Date(t.due);
    label='자동 배치된 작업 시간';
    body=`<dt>작업</dt><dd>${fmtDate(fromYmd(it.date))} ${toHM(it.s)}–${toHM(it.e)} (${hrs(it.e-it.s)})</dd><dt>마감</dt><dd>${fmtDate(due)} ${t.due.slice(11)}</dd><dt>메모</dt><dd>다른 일정이 생기면 알아서 다른 틈으로 옮겨요.</dd>`;
    actions=`<button class="btn primary" data-sdone="${t.id}">과제 완료</button>`;
  }
  sheetItem=it;
  $('#layer').innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(it.title)}">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${pill(cat)}<span class="hint">${label}</span></div>
    <h2>${esc(it.title)}</h2><dl>${body}</dl>
    <div><div class="hint" style="margin-bottom:6px">카테고리 바꾸기</div><div class="cats">${state.cats.map(c=>`<button class="cchip" data-setcat="${c.id}" aria-pressed="${c.id===cat}" style="${cvars(c.id)}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div></div>
    <div class="row"><button class="btn ghost" data-close>닫기</button>${actions}</div></div></div>`;
}
function closeSheet(){$('#layer').innerHTML='';sheetItem=null}

let toastT;
function toast(msg,kind){
  let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.className='toast '+(kind||'');el.textContent=msg;el.style.opacity=1;
  clearTimeout(toastT);toastT=setTimeout(()=>{el.style.opacity=0},2600);
}
function arm(btn,label){if(btn.dataset.armed)return true;btn.dataset.armed=1;btn.dataset.orig=btn.textContent;btn.textContent=label;btn.classList.add('danger');setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.orig;if(!btn.hasAttribute('data-wipe'))btn.classList.remove('danger')}},3500);return false}
function calShift(n){
  if(n===0)calDate=today();
  else if(calMode==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);
  else calDate=addDays(calDate,calMode==='week'?7*n:n);
  render();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest(s);
  let b;
  if(c('[data-scrim]')&&!c('.sheet')){closeSheet();return}
  if(c('[data-close]')){closeSheet();return}
  if((b=c('[data-ev]'))){const it=itemMap[b.dataset.ev];if(it)openSheet(it);return}
  if((b=c('[data-add]'))){
    let pre='';
    if(b.dataset.date){const d=fromYmd(b.dataset.date);pre=`${d.getMonth()+1}월 ${d.getDate()}일 `;if(b.dataset.time)pre+=`${b.dataset.time}부터 ${b.dataset.end} `}
    openAdd(pre);return}
  if((b=c('[data-go]'))){go(b.dataset.go,b.dataset.mode?{mode:b.dataset.mode,date:today()}:null);return}
  if((b=c('[data-openday]'))){go('cal',{mode:'day',date:fromYmd(b.dataset.openday)});return}
  if((b=c('[data-calmode]'))){calMode=b.dataset.calmode;render();return}
  if((b=c('[data-calnav]'))){calShift(+b.dataset.calnav);return}
  if((b=c('[data-pickday]'))){const d=fromYmd(b.dataset.pickday);if(ymd(d)===ymd(calDate)){go('cal',{mode:'day',date:d});return}calDate=d;render();return}
  if((b=c('[data-filter]'))){const id=b.dataset.filter;state.hidden=state.hidden.includes(id)?state.hidden.filter(x=>x!==id):[...state.hidden,id];commit();return}
  if((b=c('.dcol'))){
    const px=+b.dataset.px,y=e.clientY-b.getBoundingClientRect().top,m=Math.min(H0*60+Math.floor(y/px*2)*30,22*60),d=fromYmd(b.dataset.date);
    openAdd(`${d.getMonth()+1}월 ${d.getDate()}일 ${toHM(m)}부터 ${toHM(Math.min(m+60,1439))} `);return}
  if(c('[data-clearsample]')){state=empty();commit();toast('깨끗하게 비웠어요. 이제 내 일정을 넣어보세요');return}
  if(c('[data-keepsample]')){state.sampleOK=true;commit();return}
  if(c('[data-welcomed]')){state.welcomed=true;commit();return}
  if(c('[data-loadsample]')){state=seed();commit();toast('예시 일정을 불러왔어요');return}
  if((b=c('[data-ex]'))){$('#q').value=b.dataset.ex;qCatManual=false;refreshQuick();return}
  if((b=c('[data-qcat]'))){const id=b.dataset.qcat;if(qCat===id&&qCatManual)qCatManual=false;else{qCat=id;qCatManual=true}refreshQuick();return}
  if(c('#addCat')){addingCat=true;renderCatRow();return}
  if(c('#qAdd')){addFromQuick();return}
  if((b=c('[data-setcat]'))&&sheetItem){const it=sheetItem,list=it.kind==='repeat'?state.repeats:it.kind==='appt'?state.events:state.tasks;
    const x=list.find(k=>k.id===it.ref);if(x){x.cat=b.dataset.setcat;it.cat=x.cat}commit();openSheet(it);return}
  if((b=c('[data-fix]'))){const ev=state.events.find(x=>x.id===b.dataset.fix);if(!ev)return;const wd=wdIdx(fromYmd(ev.date));
    state.repeats.push({id:uid(),title:ev.title,days:[wd],start:ev.start,end:ev.end,place:ev.place,cat:ev.cat});
    state.events=state.events.filter(x=>x.id!==ev.id);closeSheet();commit();toast(`매주 ${DAYS[wd]}요일 ${ev.start}–${ev.end}에 고정했어요`);return}
  if((b=c('[data-sdel]'))){if(!arm(b,'한 번 더 누르면 삭제돼요'))return;const[k,id]=b.dataset.sdel.split(':');
    if(k==='repeat')state.repeats=state.repeats.filter(x=>x.id!==id);else state.events=state.events.filter(x=>x.id!==id);
    closeSheet();commit();toast('삭제했어요');return}
  if((b=c('[data-sdone]'))){const x=state.tasks.find(k=>k.id===b.dataset.sdone);if(x)x.done=true;closeSheet();commit();toast('완료! 남은 작업 시간을 비웠어요');return}
  if(c('[data-cleardone]')){state.tasks=state.tasks.filter(x=>!x.done);commit();return}
  if((b=c('[data-friend]'))){const f=b.dataset.friend;poll.friends.has(f)?poll.friends.delete(f):poll.friends.add(f);render();return}
  if((b=c('[data-cell]'))){const[ds,h]=b.dataset.cell.split('|');const{cells,people}=pollData();const cc=cells[ds+h]||[];const no=people.filter(p=>!cc.includes(p));
    $('#who').textContent=`${fmtDate(fromYmd(ds))} ${h}시 · 가능: ${cc.join(', ')||'없음'}${no.length?' / 안 됨: '+no.join(', '):''}`;return}
  if((b=c('[data-confirm]'))){const[ds,h]=b.dataset.confirm.split('|');const{people,best}=pollData();const s=best.find(x=>x.ds===ds&&x.h===+h);
    state.events.push({id:uid(),title:poll.name||'모임',date:ds,start:pad(+h)+':00',end:pad(+h+poll.dur)+':00',place:'함께: '+(s?s.who:people).filter(p=>p!=='나').join(', '),cat:guessCat(poll.name)||fallbackCat()});
    save();toast(`${fmtDate(fromYmd(ds))} ${h}시로 확정했어요`);go('cal',{mode:'day',date:fromYmd(ds)});return}
  if((b=c('[data-delrep]'))){if(!arm(b,'정말 삭제'))return;state.repeats=state.repeats.filter(x=>x.id!==b.dataset.delrep);commit();return}
  if((b=c('[data-color]'))){const cc=catOf(b.dataset.color);cc.color=(cc.color+1)%NCOL;commit();return}
  if((b=c('[data-delcat]'))){if(!arm(b,'정말 삭제'))return;const id=b.dataset.delcat;
    state.cats=state.cats.filter(x=>x.id!==id);const to=fallbackCat();
    [...state.repeats,...state.events,...state.tasks].forEach(x=>{if(x.cat===id)x.cat=to});
    state.hidden=state.hidden.filter(x=>x!==id);commit();toast(`삭제했어요. 일정은 '${catOf(to).name}'으로 옮겼어요`);return}
  if((b=c('[data-wipe]'))){if(!arm(b,'정말 모두 지울까요? 한 번 더'))return;state=empty();save();toast('모두 지웠어요. 새로 시작해요');go('home');return}
  if((b=c('[data-loadsample-arm]'))){if(!arm(b,'지금 일정이 바뀌어요. 한 번 더'))return;state=seed();commit();toast('예시 일정을 불러왔어요');return}
  if(c('#exportBtn')){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='teum-backup-'+ymd(today())+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('백업 파일을 저장했어요');return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='taskForm'){
    const title=$('#tf-title').value.trim(),hours=parseFloat($('#tf-hours').value);
    if(!title||!(hours>0)){toast('과제 이름과 예상 시간을 확인해주세요','warn');return}
    state.tasks.push({id:uid(),title,due:$('#tf-date').value+'T'+$('#tf-time').value,hours,done:false,cat:$('#tf-cat').value});state.welcomed=true;commit();toast('빈 시간에 작업을 배치했어요');
  }else if(f==='repForm'){
    const days=DAYS.map((_,i)=>i).filter(i=>$('#rf-d'+i).checked),s=$('#rf-start').value,en=$('#rf-end').value;
    if(!days.length){toast('요일을 하나 이상 골라주세요','warn');return}
    if(toMin(en)<=toMin(s)){toast('끝나는 시간이 시작보다 늦어야 해요','warn');return}
    state.repeats.push({id:uid(),title:$('#rf-title').value.trim(),days,start:s,end:en,place:$('#rf-place').value.trim(),cat:$('#rf-cat').value});state.welcomed=true;commit();toast(`매주 ${days.map(d=>DAYS[d]).join('·')}요일에 고정했어요`);
  }else if(f==='catForm'){const id=addCategory($('#cat-new').value);if(id){commit();toast('카테고리를 만들었어요')}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='qWeekly'){refreshQuick();return}
  if(t.dataset.done){const x=state.tasks.find(k=>k.id===t.dataset.done);if(x)x.done=t.checked;commit();return}
  if(t.dataset.rename){const cc=catOf(t.dataset.rename),v=t.value.trim();if(v)cc.name=v;commit();return}
  if(t.dataset.kw){catOf(t.dataset.kw).kw=t.value.split(',').map(x=>x.trim()).filter(Boolean);save();toast('키워드를 저장했어요');return}
  if(t.id==='pf-dur'){poll.dur=+t.value;render();return}
  if(t.id==='pf-week'){poll.week=+t.value;render();return}
  if(t.id==='importFile'){const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const s=JSON.parse(r.result);if(s.v!==2||!Array.isArray(s.cats)||!Array.isArray(s.repeats))throw 0;state=s;commit();toast('백업을 불러왔어요')}catch(err){toast('틈 백업 파일이 아니에요. 내보내기로 만든 .json 파일을 골라주세요','warn')}};
    r.readAsText(f);t.value=''}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){if(!e.target.value.trim())qCatManual=false;refreshQuick()}
  if(e.target.id==='pf-name')poll.name=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return}
  if(e.target.id==='q'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();addFromQuick();return}
  if(e.target.id==='newCat'){
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const id=addCategory(e.target.value);addingCat=false;if(id){qCat=id;qCatManual=true;save();toast('카테고리를 만들었어요')}refreshQuick()}
    if(e.key==='Escape'){addingCat=false;renderCatRow()}
  }
});
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(!e.target.closest('.swipe')||$('[data-scrim]')){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&!(calMode==='week'&&e.target.closest('.cal-scroll')))calShift(dx<0?1:-1)},{passive:true});
if(mqPhone.addEventListener)mqPhone.addEventListener('change',render);
setInterval(()=>{if(!$('[data-scrim]')&&!['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName))render()},60000);
if(!IN_FRAME&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
})();
</script>
